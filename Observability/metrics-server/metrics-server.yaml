# ==============================================================================
# Kubernetes Observability: Metrics Server Complete Stack
# ==============================================================================
# WHAT IS METRICS SERVER?
# Metrics Server is a scalable, cluster-wide aggregator of operational data
# (CPU and Memory utilization). It collects metrics from Summary APIs exposed
# by Kubelets on each worker node and exposes them to the Kubernetes API server 
# via the Metrics API (`metrics.k8s.io`).
#
# WHY DO YOU NEED IT?
# 1. Powers `kubectl top nodes` and `kubectl top pods`.
# 2. Powers Horizontal Pod Autoscaler (`HPA`) to make scaling decisions.
# 3. Powers Vertical Pod Autoscaler (`VPA`) to adjust resource requests.
#
# HOW IT DIFFERS FROM PROMETHEUS:
# - Metrics Server: Keeps only IN-MEMORY, transient, non-historical metrics (last 1-2 min).
#   It does NOT write to disk and does NOT support PromQL or long-term alerting.
# - Prometheus: Scrapes full time-series history, stores to disk, supports alerting
#   and rich querying.
#
# COMPONENTS CREATED IN THIS MANIFEST:
# 1. ServiceAccount (`metrics-server` in `kube-system`)
# 2. ClusterRole & ClusterRoleBindings (read node stats & auth delegation)
# 3. RoleBinding (access to extension-apiserver-authentication)
# 4. ClusterIP Service (port 443 -> containerPort 10250)
# 5. Deployment (runs metrics-server container with lab-friendly flags)
# 6. APIService (`v1beta1.metrics.k8s.io` to aggregate into main kube-apiserver)
#
# IMPORTANT CLI COMMANDS:
# - Apply:            kubectl apply -f metrics-server.yaml
# - Verify Service:   kubectl get apiservice v1beta1.metrics.k8s.io
# - Check Node Stats: kubectl top nodes
# - Check Pod Stats:  kubectl top pods -A
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    k8s-app: metrics-server

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:aggregated-metrics-reader
  labels:
    k8s-app: metrics-server
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:metrics-server
  labels:
    k8s-app: metrics-server
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats", "nodes/spec", "nodes/summary"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-server-auth-reader
  namespace: kube-system
  labels:
    k8s-app: metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server:system:auth-delegator
  labels:
    k8s-app: metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:metrics-server
  labels:
    k8s-app: metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system

---
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    k8s-app: metrics-server
spec:
  selector:
    k8s-app: metrics-server
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: https

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    k8s-app: metrics-server
spec:
  selector:
    matchLabels:
      k8s-app: metrics-server
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      serviceAccountName: metrics-server
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      containers:
        - name: metrics-server
          image: registry.k8s.io/metrics-server/metrics-server:v0.7.1
          imagePullPolicy: IfNotPresent
          args:
            - --cert-dir=/tmp
            - --secure-port=10250
            # Use internal IPs to communicate with kubelets
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
            # NOTE FOR LABS / MINIKUBE / KIND / K3S:
            # Local clusters often use self-signed Kubelet certificates.
            # This flag bypasses CA validation so metrics-server can scrape nodes.
            # (Remove in production clusters with valid CA infrastructure!)
            - --kubelet-insecure-tls
          ports:
            - name: https
              containerPort: 10250
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp-dir
          emptyDir: {}

---
# ==============================================================================
# The Aggregated APIService Registration
# ==============================================================================
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
  labels:
    k8s-app: metrics-server
spec:
  # The API group and version registered into the Kubernetes API
  group: metrics.k8s.io
  version: v1beta1

  # Priority determines ordering when multiple versions exist
  groupPriorityMinimum: 100
  versionPriority: 100

  # Instructs kube-apiserver to forward /apis/metrics.k8s.io/v1beta1 requests
  # directly to the metrics-server Service in kube-system!
  service:
    name: metrics-server
    namespace: kube-system
    port: 443

  # Skip TLS certificate verification between kube-apiserver and metrics-server
  # (Useful for sandbox clusters using self-signed internal certs)
  insecureSkipTLSVerify: true

