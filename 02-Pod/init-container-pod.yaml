# ==============================================================================
# Kubernetes Object: Pod with Init Containers
# ==============================================================================
# WHAT ARE INIT CONTAINERS?
# Init containers are specialized containers that run BEFORE the main app containers.
#
# KEY BEHAVIORS:
# 1. Sequential Execution: They always run in the order defined in the YAML.
# 2. Complete Before Next: Each init container must exit successfully (exit code 0)
#    before the next one starts.
# 3. Main Container Gate: The main application container will NEVER start until ALL
#    init containers succeed.
# 4. Restart on Failure: If an init container fails, Kubernetes restarts the Pod
#    (unless restartPolicy is Never).
#
# COMMON USE CASES:
# - Waiting for external dependencies (Database, message broker) to become reachable.
# - Running database migrations before application starts.
# - Downloading configuration files, TLS certificates, or setup scripts.
# - Setting up file permissions in a volume.
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f init-container-pod.yaml
# - Status:       kubectl get pod init-demo-pod (will show 'Init:0/2' -> 'Init:1/2' -> 'Running')
# - View Logs:    kubectl logs init-demo-pod -c wait-for-database
# ==============================================================================

apiVersion: v1
kind: Pod

metadata:
  name: init-demo-pod
  namespace: default
  labels:
    app: inventory-service

spec:
  # Volumes shared between init containers and application containers
  volumes:
    - name: app-config-volume
      emptyDir: {}

  # ----------------------------------------------------------------------------
  # INIT CONTAINERS: Executed in sequence BEFORE the main containers
  # ----------------------------------------------------------------------------
  initContainers:
    # --- Step 1: Wait for a backend dependency ---
    - name: wait-for-database
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Init 1: Checking database readiness...";
          # In a real environment, you might do: until nc -z -w 2 db-service 5432; do sleep 2; done;
          sleep 3;
          echo "Database is ready!";
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "50m"
          memory: "64Mi"

    # --- Step 2: Prepare configuration and data assets ---
    - name: generate-runtime-config
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Init 2: Writing dynamic config file...";
          echo "database_host=db.internal.net" > /config/app.conf;
          echo "initialized_at=$(date -u)" >> /config/app.conf;
          echo "Init 2 completed successfully.";
      volumeMounts:
        - name: app-config-volume
          mountPath: /config
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "50m"
          memory: "64Mi"

  # ----------------------------------------------------------------------------
  # MAIN CONTAINERS: Starts ONLY after all init containers have exited with 0
  # ----------------------------------------------------------------------------
  containers:
    - name: inventory-app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Main app starting. Reading generated configuration:";
          cat /config/app.conf;
          while true; do sleep 3600; done
      volumeMounts:
        - name: app-config-volume
          mountPath: /config
          readOnly: true
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

