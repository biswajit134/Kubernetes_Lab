# ==============================================================================
# Kubernetes Object: Secret (TLS Certificate)
# ==============================================================================
# WHAT IS A TLS SECRET?
# A Secret of type 'kubernetes.io/tls' holds a TLS private key and certificate.
# These secrets are commonly bound to Ingress controllers or API gateways to 
# terminate HTTPS traffic.
#
# REQUIRED KEYS IN DATA / STRINGDATA:
# - tls.crt: The public certificate file (or certificate bundle/chain)
# - tls.key: The private key corresponding to the certificate
#
# IMPORTANT CLI COMMANDS:
# - Create via CLI: kubectl create secret tls tls-example-cert \
#                     --cert=path/to/tls.crt \
#                     --key=path/to/tls.key
# - Apply YAML:     kubectl apply -f tls-secret.yaml
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: example-tls-cert
  namespace: default
  labels:
    app: secure-gateway

type: kubernetes.io/tls

stringData:
  # Dummy self-signed certificate for demonstration
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDITCCAomgAwIBAgIUQ159Gg87g...[SAMPLE CERTIFICATE CONTENT]...
    -----END CERTIFICATE-----

  # Corresponding private key
  tls.key: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEowIBAAKCAQEA0s7g9t123...[SAMPLE PRIVATE KEY CONTENT]...
    -----END RSA PRIVATE KEY-----

