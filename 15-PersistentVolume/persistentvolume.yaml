# ==============================================================================
# Kubernetes Object: PersistentVolume (Production Cloud CSI)
# ==============================================================================
# WHAT IS A PERSISTENTVOLUME?
# A PersistentVolume (PV) is a piece of storage in the cluster that has been 
# provisioned dynamically via a StorageClass or statically mapped to an existing
# cloud disk by a cluster administrator.
#
# WHY AVOID hostPath IN PRODUCTION:
# In local sandboxes, `hostPath` is used because no cloud provider exists.
# In PRODUCTION, `hostPath` is an anti-pattern: it ties your data to a single 
# physical node. If that node reboots, crashes, or scales down, your data is lost.
#
# PRODUCTION CLOUD CSI BINDING:
# Production PVs use the CSI driver (`ebs.csi.aws.com`) and reference an actual 
# cloud volume handle (`vol-0a1b2c3d4e5f67890`) with node affinity for multi-zone
# resilience.
#
# ACCESS MODES:
# - ReadWriteOnce (RWO): Mounted as read-write by a single node (standard for EBS/PD).
# - ReadOnlyMany  (ROX): Mounted as read-only by multiple nodes simultaneously.
# - ReadWriteMany (RWX): Mounted by multiple nodes (requires AWS EFS, GCP Filestore, NFS).
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f persistentvolume.yaml
# - Get PVs:      kubectl get pv
# - Describe:     kubectl describe pv cloud-ebs-pv
# ==============================================================================

apiVersion: v1
kind: PersistentVolume

metadata:
  name: cloud-ebs-pv
  labels:
    tier: production-storage
    environment: production

spec:
  # Capacity allocated to match the cloud disk size
  capacity:
    storage: 50Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  # Reclaim policy: 'Retain' keeps the physical cloud volume even if PVC is deleted
  persistentVolumeReclaimPolicy: Retain

  # Bound to the production StorageClass
  storageClassName: fast-ssd-storage

  # ----------------------------------------------------------------------------
  # Production CSI Driver Specification (AWS EBS CSI Plugin)
  # ----------------------------------------------------------------------------
  csi:
    driver: ebs.csi.aws.com
    # Unique volume ID of the cloud disk (e.g. AWS EBS Volume ID)
    volumeHandle: vol-0a1b2c3d4e5f67890
    fsType: ext4
    volumeAttributes:
      encrypted: "true"

  # ----------------------------------------------------------------------------
  # Node Affinity: Constrains volume attachment to the specific cloud zone(s)
  # where the physical disk was created
  # ----------------------------------------------------------------------------
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.ebs.csi.aws.com/zone
              operator: In
              values:
                - us-east-1a
                - us-east-1b
