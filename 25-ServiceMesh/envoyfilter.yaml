# ==============================================================================
# Service Mesh Object: EnvoyFilter (Istio Networking CRD)
# ==============================================================================
# WHAT IS AN ENVOYFILTER?
# EnvoyFilter provides a mechanism to customize the underlying Envoy proxy 
# configuration generated by Istio Pilot.
#
# WHEN TO USE AN ENVOYFILTER:
# - When you need an advanced Envoy feature that is NOT exposed by standard Istio CRDs.
# - Injecting custom Lua scripts into the request/response processing pipeline.
# - Loading WebAssembly (Wasm) filters.
# - Modifying HTTP header processing, compression (Brotli/Gzip), or rate-limiting filters.
#
# CAUTION:
# EnvoyFilter is an advanced, low-level power-user feature. Because it directly patches
# internal Envoy JSON/Protobuf configurations, changes may break between Istio versions.
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f envoyfilter.yaml
# - Get:          kubectl get envoyfilter
# - Verify Config:istioctl proxy-config routes <pod-name> -o json
# ==============================================================================

apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter

metadata:
  name: inject-custom-header-filter
  namespace: production
  labels:
    tier: proxy-customization

spec:
  # Workload selector (applies only to pods labeled app: reviews)
  workloadSelector:
    labels:
      app: reviews

  # ----------------------------------------------------------------------------
  # ConfigPatches: How and where to modify the Envoy configuration
  # ----------------------------------------------------------------------------
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND # Apply to inbound traffic hitting the sidecar
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        # INSERT_BEFORE inserts this custom filter immediately before the Envoy router filter
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            # Inline Lua script that adds a custom header to every response
            inlineCode: |
              function envoy_on_response(response_handle)
                response_handle:headers():add("X-Mesh-Processed-By", "Istio-Envoy-Proxy")
              end

