# ==============================================================================
# Kubernetes Manifest: Pod Consuming ConfigMap
# ==============================================================================
# This manifest illustrates all 3 standard ways a Pod consumes ConfigMap data:
# 1. Direct environment variable lookup (valueFrom.configMapKeyRef).
# 2. Bulk environment variable injection (envFrom.configMapRef).
# 3. Volume mount as configuration files (volumes.configMap).
#
# PREREQUISITE:
# Apply configmap.yaml first!
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f pod-using-configmap.yaml
# - Check Env:    kubectl exec -it pod-configmap-consumer -- env
# - Read Mounted: kubectl exec -it pod-configmap-consumer -- cat /etc/config/app-settings.json
# ==============================================================================

apiVersion: v1
kind: Pod

metadata:
  name: pod-configmap-consumer
  namespace: default
  labels:
    app: inventory-api

spec:
  # ----------------------------------------------------------------------------
  # Volume Definition referencing the ConfigMap
  # ----------------------------------------------------------------------------
  volumes:
    - name: config-volume
      configMap:
        name: app-config
        # Optional: items allows selectively exposing specific keys as files
        items:
          - key: app-settings.json
            path: app-settings.json
          - key: nginx.conf
            path: custom-nginx.conf
        # Set file permissions (e.g. 0644 read-only for non-owners)
        defaultMode: 0644

  containers:
    - name: app-worker
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "=== Injected Environment Variables ===";
          echo "APP_ENV: $APP_ENV";
          echo "LOG_LEVEL: $LOG_LEVEL";
          echo "CUSTOM_PORT: $CUSTOM_PORT";
          echo "=== Mounted File Content ===";
          cat /etc/config/app-settings.json;
          while true; do sleep 3600; done

      # ------------------------------------------------------------------------
      # Method 1 & 2: Environment Variables
      # ------------------------------------------------------------------------
      env:
        # Method 1: Single key mapping
        - name: CUSTOM_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PORT

      # Method 2: Bulk import all keys as environment variables
      envFrom:
        - configMapRef:
            name: app-config

      # ------------------------------------------------------------------------
      # Method 3: Volume Mount (Filesystem)
      # ------------------------------------------------------------------------
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true

      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

