# ==============================================================================
# Kubernetes Object: ServiceAccount
# ==============================================================================
# WHAT IS A SERVICEACCOUNT?
# A ServiceAccount provides an identity for processes that run in a Pod.
#
# HUMAN USERS VS SERVICE ACCOUNTS:
# - User Accounts are for human operators (e.g. developers, sysadmins) and are 
#   typically managed externally via OpenID Connect (OIDC), LDAP, Google IAM, etc.
# - ServiceAccounts are managed directly by the Kubernetes API server and are 
#   intended for machines, pods, CI/CD pipelines, and in-cluster applications.
#
# HOW PODS USE SERVICEACCOUNTS:
# - When a Pod runs, its ServiceAccount token is automatically mounted at:
#   /var/run/secrets/kubernetes.io/serviceaccount/token
# - In-cluster applications (e.g. client-go, Python kubernetes SDK) use this 
#   token to authenticate against the Kubernetes API.
# - If your pod doesn't need to talk to the Kubernetes API, set:
#   `automountServiceAccountToken: false` (Security Best Practice!).
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f serviceaccount.yaml
# - Get SA:       kubectl get serviceaccounts (or sa)
# - Describe:     kubectl describe sa app-service-account
# ==============================================================================

apiVersion: v1
kind: ServiceAccount

metadata:
  name: app-service-account
  namespace: default
  labels:
    app: backend-service
  annotations:
    # Example for cloud IAM workload identity (e.g. AWS IRSA or GCP Workload Identity):
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/backend-service-role"

# If false, disables automatic token projection into pods using this ServiceAccount
automountServiceAccountToken: true

# Image pull secrets to automatically attach to pods using this ServiceAccount
imagePullSecrets:
  - name: private-registry-secret

