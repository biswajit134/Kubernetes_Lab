# ==============================================================================
# Kubernetes Object: PersistentVolumeClaim (Production Cloud Storage)
# ==============================================================================
# WHAT IS A PERSISTENTVOLUMECLAIM?
# A PersistentVolumeClaim (PVC) is a request for storage by a user/workload.
# In production, PVCs bind directly to a production CSI StorageClass which dynamically
# provisions real cloud disks (e.g. AWS EBS gp3) without manual administrator intervention.
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f persistentvolumeclaim.yaml
# - Get PVCs:     kubectl get pvc -n production
# - Describe:     kubectl describe pvc app-data-pvc -n production
# ==============================================================================

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: app-data-pvc
  namespace: production
  labels:
    app: stateful-app
    tier: production-data

spec:
  # Desired access mode (ReadWriteOnce = mounted by a single node)
  accessModes:
    - ReadWriteOnce

  # Binds to the production Cloud CSI StorageClass (AWS EBS gp3 / GKE Balanced PD)
  storageClassName: fast-ssd-storage

  volumeMode: Filesystem

  # Resource requests: Amount of storage required
  resources:
    requests:
      storage: 20Gi
