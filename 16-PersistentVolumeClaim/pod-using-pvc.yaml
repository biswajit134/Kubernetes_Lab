# ==============================================================================
# Kubernetes Manifest: Pod Using PersistentVolumeClaim (Production)
# ==============================================================================
# Shows how a Pod mounts and uses a PersistentVolumeClaim bound to cloud storage
# to persist state across restarts, crashes, and reschedule events.
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f pod-using-pvc.yaml
# - Check mount:  kubectl exec -it pvc-consumer-pod -n production -- df -h /data
# - View logs:    kubectl logs pvc-consumer-pod -n production
# ==============================================================================

apiVersion: v1
kind: Pod

metadata:
  name: pvc-consumer-pod
  namespace: production
  labels:
    app: persistent-worker
    tier: production-data

spec:
  # ----------------------------------------------------------------------------
  # Volumes section referencing the production PVC
  # ----------------------------------------------------------------------------
  volumes:
    - name: storage-volume
      persistentVolumeClaim:
        claimName: app-data-pvc

  containers:
    - name: file-writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Production worker started at $(date)" >> /data/access.log;
          echo "Viewing persistent history:";
          cat /data/access.log;
          while true; do
            echo "$(date): Health check ping" >> /data/access.log;
            sleep 10;
          done

      # Mount the cloud storage volume at /data
      volumeMounts:
        - name: storage-volume
          mountPath: /data

      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
