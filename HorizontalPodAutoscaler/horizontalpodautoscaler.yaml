# ==============================================================================
# Kubernetes Object: HorizontalPodAutoscaler (HPA v2)
# ==============================================================================
# WHAT IS AN HPA?
# A HorizontalPodAutoscaler automatically scales the number of Pods in a workload
# (Deployment, ReplicaSet, or StatefulSet) based on observed CPU utilization,
# memory usage, or custom metrics (e.g., HTTP requests/sec, queue length).
#
# PREREQUISITES:
# 1. Metrics Server MUST be installed in your cluster (for CPU/Memory metrics).
# 2. Containers in target pods MUST declare `resources.requests.cpu` and/or
#    `resources.requests.memory`. Without requests, HPA cannot calculate percentage!
#
# SCALING ALGORITHM:
#   desiredReplicas = ceil[currentReplicas * ( currentMetricValue / desiredMetricValue )]
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f horizontalpodautoscaler.yaml
# - Get HPA:      kubectl get hpa
# - Describe:     kubectl describe hpa web-app-hpa
# - Generate load:kubectl run -i --tty load-gen --rm --image=busybox:1.36 -- /bin/sh -c "while true; do wget -q -O- http://web-deployment; done"
# ==============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: web-app-hpa
  namespace: default
  labels:
    app: web-store
    tier: autoscaling

spec:
  # ----------------------------------------------------------------------------
  # ScaleTargetRef: Workload to scale
  # ----------------------------------------------------------------------------
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-deployment

  # ----------------------------------------------------------------------------
  # Bounds on Pod count
  # ----------------------------------------------------------------------------
  minReplicas: 2
  maxReplicas: 10

  # ----------------------------------------------------------------------------
  # Metrics for Scaling Decisions
  # ----------------------------------------------------------------------------
  metrics:
    # 1. CPU Utilization Metric
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Target average 70% of CPU request across all pods
          averageUtilization: 70

    # 2. Memory Utilization Metric
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # Target average 80% of Memory request across all pods
          averageUtilization: 80

  # ----------------------------------------------------------------------------
  # Scaling Behavior (Stabilization Windows & Rate Limits)
  # ----------------------------------------------------------------------------
  behavior:
    # Scale Down configuration (Prevent flapping / rapid oscillation)
    scaleDown:
      # Wait 300 seconds (5 min) after load drops before terminating pods
      stabilizationWindowSeconds: 300
      policies:
        # Scale down at most 10% of existing pods or 1 pod every 60 seconds
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

    # Scale Up configuration (React fast to sudden traffic spikes)
    scaleUp:
      # React immediately with 0 stabilization delay
      stabilizationWindowSeconds: 0
      policies:
        # Can scale up by 100% (double the pods) or 4 pods every 15 seconds
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

