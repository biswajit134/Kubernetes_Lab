# ==============================================================================
# GitOps Secret Management: SecretStore (External Secrets Operator)
# ==============================================================================
# WHAT IS THE EXTERNAL SECRETS OPERATOR (ESO)?
# In enterprise production GitOps, RAW SECRETS ARE NEVER COMMITTED TO GIT!
# Committing Base64 strings to Git (even in private repositories) violates 
# compliance frameworks (SOC2, PCI-DSS, ISO 27001).
#
# The External Secrets Operator (ESO) bridges Kubernetes with external secret vaults:
# - AWS Secrets Manager / AWS Systems Manager Parameter Store
# - HashiCorp Vault
# - Google Cloud Secret Manager
# - Azure Key Vault
# - 1Password / CyberArk
#
# HOW A SECRETSTORE WORKS:
# A `SecretStore` defines the connection, authentication, and endpoint to an external
# vault provider. It uses cloud IAM Workload Identity (IRSA on AWS, Workload Identity on GCP)
# so NO static cloud API keys or passwords are needed to authenticate!
#
# SCOPING:
# - SecretStore: Namespaced resource (scoped to 'production').
# - ClusterSecretStore: Cluster-scoped resource reusable across all namespaces.
#
# IMPORTANT CLI COMMANDS:
# - Apply:             kubectl apply -f secret-store.yaml
# - Get SecretStores:  kubectl get secretstores -n production
# - Check Condition:   kubectl describe secretstore aws-secrets-manager -n production
# ==============================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore

metadata:
  name: aws-secrets-manager
  namespace: production
  labels:
    tier: security-credentials
    environment: production

spec:
  provider:
    # --------------------------------------------------------------------------
    # Option A: AWS Secrets Manager Provider (Using IAM Roles for Service Accounts - IRSA)
    # --------------------------------------------------------------------------
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          # Uses the ServiceAccount's projected IAM token (Zero Static Credentials!)
          serviceAccountRef:
            name: eso-workload-identity-sa

    # --------------------------------------------------------------------------
    # Option B (Alternative): HashiCorp Vault Provider
    # --------------------------------------------------------------------------
    # vault:
    #   server: "https://vault.internal.mycompany.com:8200"
    #   path: "secret"
    #   version: "v2"
    #   auth:
    #     kubernetes:
    #       mountPath: "kubernetes"
    #       role: "production-workload-role"
    #       serviceAccountRef:
    #         name: eso-workload-identity-sa

    # --------------------------------------------------------------------------
    # Option C (Alternative): Google Cloud Secret Manager
    # --------------------------------------------------------------------------
    # gcpsm:
    #   projectID: "my-gcp-prod-project"
    #   auth:
    #     workloadIdentity:
    #       clusterLocation: "us-central1"
    #       clusterName: "prod-cluster"
    #       serviceAccountRef:
    #         name: eso-workload-identity-sa

