# ==============================================================================
# GitOps Secret Management: ExternalSecret (External Secrets Operator)
# ==============================================================================
# WHAT IS AN EXTERNALSECRET?
# An `ExternalSecret` describes WHAT secret data to fetch from the `SecretStore` 
# and HOW to transform and project it into a native Kubernetes Secret.
#
# HOW IT WORKS (THE GITOPS LIFECYCLE):
# 1. Developer commits this `external-secret.yaml` safely into public/private Git.
#    (Notice: ZERO passwords or sensitive data exist in this YAML!)
# 2. Argo CD or Flux applies this manifest to the production cluster.
# 3. The External Secrets Operator reconciles the resource:
#    - Authenticates to AWS Secrets Manager using Pod Workload Identity.
#    - Fetches the JSON payload stored under 'production/database/credentials'.
#    - Automatically creates/updates the native Kubernetes Secret named 'db-credentials'.
# 4. Applications consume 'db-credentials' normally via env vars or volume mounts!
# 5. Continuous Synchronization: When a DBA rotates the password in AWS Secrets Manager,
#    ESO detects the change within `refreshInterval` and updates the Kubernetes Secret!
#
# IMPORTANT CLI COMMANDS:
# - Apply:                 kubectl apply -f external-secret.yaml
# - Get ExternalSecrets:   kubectl get externalsecrets -n production (or es)
# - Inspect Status:        kubectl describe es database-credentials-sync -n production
# - Verify Synced Secret:  kubectl get secret db-credentials -n production
# ==============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: database-credentials-sync
  namespace: production
  labels:
    tier: security-credentials
    app: backend-api

spec:
  # How frequently ESO polls the cloud vault for rotated credentials
  refreshInterval: "1h"

  # Reference to the SecretStore defined in secret-store.yaml
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  # ----------------------------------------------------------------------------
  # Target: The native Kubernetes Secret to create and maintain
  # ----------------------------------------------------------------------------
  target:
    name: db-credentials # This matches the Secret name our Pods reference!
    creationPolicy: Owner # ESO owns and manages this Kubernetes Secret
    deletionPolicy: Retain # Retain secret if ExternalSecret is deleted (safety)

  # ----------------------------------------------------------------------------
  # Data Mapping: Extracting keys from the external vault
  # ----------------------------------------------------------------------------
  data:
    # 1. Extract 'username' from the cloud JSON secret
    - secretKey: username
      remoteRef:
        key: production/database/credentials # Path in AWS Secrets Manager
        property: db_username               # JSON key in the secret payload

    # 2. Extract 'password' from the cloud JSON secret
    - secretKey: password
      remoteRef:
        key: production/database/credentials
        property: db_password

    # 3. Extract 'api_key' from the cloud JSON secret
    - secretKey: api_key
      remoteRef:
        key: production/api/stripe-keys
        property: live_secret_key

