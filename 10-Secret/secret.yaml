# ==============================================================================
# Kubernetes Object: Secret (Production Generated Output)
# ==============================================================================
# WHAT IS THIS MANIFEST?
# In enterprise GitOps workflows (Argo CD, Flux), this Kubernetes Secret object is 
# NOT manually committed to Git. Instead, it is the DYNAMIC OUTPUT synthesized in 
# the cluster by the External Secrets Operator (refer to 'external-secret.yaml')!
#
# WHY COMMITTING SECRETS TO GIT IS AN ANTI-PATTERN:
# 1. Base64 is NOT Encryption: Anyone with repository read access can decode Base64.
# 2. Key Leakage: Git history is immutable and distributed across developer laptops.
# 3. Compliance Violation: Hardcoded credentials violate SOC2, PCI-DSS, and ISO 27001.
#
# IN-CLUSTER RECONCILIATION:
# When 'external-secret.yaml' is applied, ESO fetches values from AWS Secrets Manager
# or HashiCorp Vault and writes this exact object into etcd dynamically.
#
# IMPORTANT CLI COMMANDS:
# - Inspect generated secret: kubectl describe secret db-credentials -n production
# - View synced keys:         kubectl get secret db-credentials -n production -o jsonpath='{.data}'
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: db-credentials
  namespace: production
  labels:
    app: backend-api
    tier: database
    # Label indicating dynamic GitOps synchronization:
    app.kubernetes.io/managed-by: external-secrets

type: Opaque

# In production, data is populated dynamically by ESO:
data:
  # Base64-encoded "postgres_admin"
  username: cG9zdGdyZXNfYWRtaW4=
  # Base64-encoded rotated password
  password: U3VwZXJTZWNyZXRQYXNzd29yZCM=
  # Base64-encoded API key
  api_key: YWtfbGl2ZV84MzlmMjAxZTkxMjA0ODU5YTg0Yg==
