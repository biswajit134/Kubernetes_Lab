# ==============================================================================
# Kubernetes Object: Secret (Opaque)
# ==============================================================================
# WHAT IS A SECRET?
# A Secret is an object that contains a small amount of sensitive data such as a 
# password, a token, or a key. Storing sensitive information in a Secret avoids 
# putting confidential credentials in pod specs or Docker images.
#
# IMPORTANT SECURITY FACTS:
# 1. Base64 is NOT Encryption: By default, values in `data` are simply Base64 
#    encoded, NOT encrypted! Anyone with RBAC access to get/describe secrets can decode them.
# 2. Encryption at Rest: Enable EncryptionConfiguration in the cluster API server 
#    so etcd encrypts secrets on disk.
# 3. RBAC: Restrict Secret access using granular RBAC roles.
#
# TWO DATA FIELDS:
# - data: Values MUST be Base64-encoded strings.
#   Example: echo -n "admin123" | base64 -> YWRtaW4xMjM=
# - stringData: Plaintext strings that Kubernetes automatically Base64-encodes
#   upon saving. Very convenient for writing YAML manifests!
#
# IMPORTANT CLI COMMANDS:
# - Apply:             kubectl apply -f secret.yaml
# - Get Secrets:       kubectl get secrets
# - View Base64:       kubectl get secret db-credentials -o jsonpath='{.data.password}'
# - Decode via CLI:    kubectl get secret db-credentials -o jsonpath='{.data.password}' | base64 --decode
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: db-credentials
  namespace: default
  labels:
    app: backend-api
    tier: database

# Type determines the structure and validation of the secret:
# - Opaque (Default): Arbitrary user-defined key-value data
# - kubernetes.io/tls: TLS private key and certificate
# - kubernetes.io/dockerconfigjson: Docker registry credentials
# - kubernetes.io/service-account-token: ServiceAccount token
type: Opaque

# 'data' expects Base64-encoded values:
data:
  # "postgres_admin" encoded in base64: cG9zdGdyZXNfYWRtaW4=
  username: cG9zdGdyZXNfYWRtaW4=

# 'stringData' accepts plaintext; Kubernetes converts it to base64 internally.
# If a key appears in both 'data' and 'stringData', the value from 'stringData' is used.
stringData:
  password: "SuperSecretPassword#2026!"
  api_key: "ak_live_839f201e91204859a84b"
  database_url: "postgresql://admin:pass@postgres.internal:5432/production_db"

