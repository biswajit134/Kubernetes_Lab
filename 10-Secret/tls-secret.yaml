# ==============================================================================
# Kubernetes Object: Secret (TLS Certificate - Cert-Manager Managed Output)
# ==============================================================================
# WHAT IS THIS SECRET?
# In enterprise production environments, TLS certificates are NEVER manually 
# pasted or committed into Git. 
#
# Instead, this Kubernetes Secret is AUTOMATICALLY GENERATED, VALIDATED, AND 
# ROTATED by cert-manager (refer to 'cert-manager-certificate.yaml')!
#
# WHY AUTOMATION IS MANDATORY:
# 1. Human Error Prevention: Expired SSL certificates cause catastrophic outages.
# 2. Automated 90-Day ACME Lifecycles: Let's Encrypt requires renewal every 60 days.
# 3. Dynamic Zero-Downtime Reloads: Ingress and Gateway controllers reload certs
#    dynamically upon secret modification.
#
# KEYS CREATED BY CERT-MANAGER:
# - tls.crt: The full certificate chain issued by Let's Encrypt / DigiCert.
# - tls.key: The RSA 4096-bit private key generated securely in the cluster.
#
# IMPORTANT CLI COMMANDS:
# - Verify managed cert: kubectl describe secret production-tls-cert -n production
# - Check expiry date:   kubectl get certificate production-tls-cert -n production
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: production-tls-cert
  namespace: production
  labels:
    app: secure-gateway
    # Label automatically added by cert-manager:
    cert-manager.io/certificate-name: production-tls-cert
  annotations:
    cert-manager.io/alt-names: "api.mycompany.com,store.mycompany.com"
    cert-manager.io/issuer-name: "letsencrypt-production"

type: kubernetes.io/tls

data:
  # In production, these fields are populated automatically by cert-manager:
  # tls.crt: <Automated Base64-encoded fullchain.pem>
  # tls.key: <Automated Base64-encoded privkey.pem>
