# ==============================================================================
# Kubernetes Manifest: Pod Consuming Secret
# ==============================================================================
# Shows how a Pod securely accesses sensitive Secret credentials:
# 1. As environment variables (best for legacy apps or simple connection strings).
# 2. Mounted as read-only files in a tmpfs in-memory filesystem (safest: prevents
#    accidental leaking via process environment dumps or crash reports).
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f pod-using-secret.yaml
# - Inspect Pod:  kubectl describe pod pod-secret-consumer
# - Read Secret:  kubectl exec pod-secret-consumer -- cat /etc/secrets/password
# ==============================================================================

apiVersion: v1
kind: Pod

metadata:
  name: pod-secret-consumer
  namespace: production
  labels:
    app: backend-api

spec:
  # ----------------------------------------------------------------------------
  # Mount Secret as an in-memory Volume (tmpfs)
  # ----------------------------------------------------------------------------
  volumes:
    - name: credentials-volume
      secret:
        secretName: db-credentials
        # Restrict Unix permissions (0400 = read-only by container user only)
        defaultMode: 0400

  containers:
    - name: api-worker
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Database user: $DB_USER";
          echo "Database password file content:";
          cat /etc/secrets/password;
          while true; do sleep 3600; done

      # ------------------------------------------------------------------------
      # Inject secret keys as Environment Variables
      # ------------------------------------------------------------------------
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password

      # ------------------------------------------------------------------------
      # Mount Secret as Volume files
      # ------------------------------------------------------------------------
      volumeMounts:
        - name: credentials-volume
          mountPath: /etc/secrets
          readOnly: true

      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

