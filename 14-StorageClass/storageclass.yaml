# ==============================================================================
# Kubernetes Object: StorageClass (Production Cloud CSI)
# ==============================================================================
# WHAT IS A STORAGECLASS?
# A StorageClass provides a way for administrators to describe the "classes" of 
# storage they offer (e.g. "fast" SSDs, "standard" HDDs, backup storage).
#
# PRODUCTION CLOUD CSI PROVISIONING:
# In enterprise production, StorageClasses delegate volume lifecycle operations
# to Container Storage Interface (CSI) drivers provided by your cloud provider.
#
# SUPPORTED CLOUD CSI DRIVERS:
# - AWS EKS:           ebs.csi.aws.com   (gp3, io2, st1) or efs.csi.aws.com (RWX)
# - Google Cloud GKE:  pd.csi.storage.gke.io (pd-ssd, pd-balanced, pd-standard)
# - Azure AKS:         disk.csi.azure.com (Premium_LRS, StandardSSD_LRS)
# - On-Prem / Hybrid:  rook-ceph.rbd.csi.ceph.com, driver.longhorn.io
#
# KEY PRODUCTION POLICIES:
# 1. volumeBindingMode: WaitForFirstConsumer
#    CRITICAL: Delays cloud disk provisioning until the pod is scheduled on a node.
#    This guarantees the disk is created in the SAME Availability Zone as the pod!
# 2. allowVolumeExpansion: true
#    Allows resizing PVC storage dynamically (e.g., 20Gi -> 50Gi) without downtime.
# 3. reclaimPolicy: Delete
#    Automatically deletes the underlying cloud disk when the PVC is deleted.
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f storageclass.yaml
# - Get:          kubectl get sc
# - Describe:     kubectl describe sc fast-ssd-storage
# ==============================================================================

apiVersion: storage.k8s.io/v1
kind: StorageClass

metadata:
  name: fast-ssd-storage
  annotations:
    # Set this StorageClass as the default provisioner for the cluster
    storageclass.kubernetes.io/is-default-class: "true"
  labels:
    tier: production-storage
    environment: production

# Production CSI Driver plugin (AWS EBS CSI driver)
# For GKE, change to: pd.csi.storage.gke.io
# For AKS, change to: disk.csi.azure.com
provisioner: ebs.csi.aws.com

# Reclaim policy: Delete the underlying cloud volume when PVC is deleted
reclaimPolicy: Delete

# Allows dynamic PVC volume expansion
allowVolumeExpansion: true

# WaitForFirstConsumer prevents multi-zone placement mismatch errors
volumeBindingMode: WaitForFirstConsumer

# ------------------------------------------------------------------------------
# Production Driver Parameters (AWS EBS gp3 volume configuration)
# ------------------------------------------------------------------------------
parameters:
  type: gp3                    # Next-generation SSD with baseline 3,000 IOPS
  iops: "3000"                 # Provisioned IOPS
  throughput: "125"            # Provisioned throughput in MiB/s
  encrypted: "true"            # Enforce hardware encryption at rest via AWS KMS
