# ==============================================================================
# Kubernetes Object: DaemonSet
# ==============================================================================
# WHAT IS A DAEMONSET?
# A DaemonSet ensures that ALL (or some) Nodes run a copy of a Pod. As new nodes 
# join the cluster, Pods are automatically added to them. As nodes are removed, 
# those Pods are garbage collected.
#
# TYPICAL USE CASES:
# 1. Cluster storage daemons: glusterd, ceph.
# 2. Log collection daemons: fluentd, logstash, fluent-bit on every node.
# 3. Node monitoring daemons: Prometheus node-exporter, Datadog agent.
# 4. Networking plugins: Calico, Cilium, kube-proxy.
#
# HOW IT DIFFERS FROM A DEPLOYMENT:
# - A Deployment schedules N replicas across the cluster based on resources.
# - A DaemonSet schedules EXACTLY ONE pod per node (unless filtered by nodeSelector/affinity).
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f daemonset.yaml
# - Get:          kubectl get ds -n kube-system
# - Describe:     kubectl describe ds log-collector-daemonset
# - Rollout:      kubectl rollout status ds/log-collector-daemonset
# ==============================================================================

apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-log-collector
  namespace: kube-system
  labels:
    k8s-app: node-log-collector
    tier: node-management

spec:
  # ----------------------------------------------------------------------------
  # Selector
  # ----------------------------------------------------------------------------
  selector:
    matchLabels:
      name: node-log-collector

  # ----------------------------------------------------------------------------
  # Update Strategy: RollingUpdate or OnDelete
  # ----------------------------------------------------------------------------
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: How many daemon pods can be offline during an update
      maxUnavailable: 1

  # ----------------------------------------------------------------------------
  # Pod Template
  # ----------------------------------------------------------------------------
  template:
    metadata:
      labels:
        name: node-log-collector
    spec:
      # ------------------------------------------------------------------------
      # Tolerations: Allow this DaemonSet to run on control-plane/master nodes too
      # ------------------------------------------------------------------------
      tolerations:
        # Tolerate master node taint (Kubernetes <1.24)
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        # Tolerate control-plane node taint (Kubernetes >=1.24)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        # Tolerate unreachable or unready nodes temporarily
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300

      # Host volume mounting: Allows reading logs directly from the node's disk
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers

      containers:
        - name: fluentbit-agent
          image: fluent/fluent-bit:2.1
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

