# ==============================================================================
# Kubernetes Object: Namespace (Production Multi-Tenancy Architecture)
# ==============================================================================
# WHAT IS A NAMESPACE?
# A Namespace provides a virtual cluster mechanism to divide cluster resources 
# between multiple users, teams, or environments (e.g., dev, staging, prod).
#
# WHY AVOID THE 'default' NAMESPACE IN PRODUCTION:
# 1. Zero Isolation: All workloads in 'default' share unpartitioned compute and network.
# 2. Security Non-Compliance: Cannot enforce strict Pod Security Admission (PSA)
#    on 'default' without breaking legacy and system pods.
# 3. Accidental Overwrites: Name collisions easily lead to accidental deletions.
# 4. RBAC Auditing: Cannot grant least-privilege RBAC roles to specific teams.
#
# PRODUCTION MULTI-TENANCY STANDARD:
# - Production workloads run in isolated namespaces (e.g., 'production').
# - Pod Security Standards (PSA) are enforced at the 'restricted' level (CIS Benchmark).
#
# IMPORTANT CLI COMMANDS:
# - Create:   kubectl apply -f namespace.yaml
# - List:     kubectl get namespaces (or kubectl get ns)
# - Inspect:  kubectl describe ns production
# - Switch:   kubectl config set-context --current --namespace=production
# ==============================================================================

apiVersion: v1
kind: Namespace

metadata:
  # Dedicated Production Namespace
  name: production
  labels:
    environment: production
    team: backend
    project: ecommerce
    
    # --------------------------------------------------------------------------
    # Production Pod Security Standards (PSA) - Strictly Enforced!
    # --------------------------------------------------------------------------
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

  annotations:
    description: "Hardened production namespace for customer-facing workloads."
    contact: "sre-team@company.internal"

---
# ------------------------------------------------------------------------------
# Development Sandbox Namespace (Baseline Security for Testing)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Namespace

metadata:
  name: development
  labels:
    environment: dev
    team: backend
    project: ecommerce
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest

  annotations:
    description: "Sandbox namespace for backend development and integration testing."
    contact: "dev-team@company.internal"
