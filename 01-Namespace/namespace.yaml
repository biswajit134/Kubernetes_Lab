# ==============================================================================
# Kubernetes Object: Namespace
# ==============================================================================
# WHAT IS A NAMESPACE?
# A Namespace provides a virtual cluster mechanism to divide cluster resources 
# between multiple users, teams, or environments (e.g., dev, staging, prod).
#
# KEY CHARACTERISTICS:
# - Scope for Names: Object names must be unique within a namespace, but can be
#   reused across different namespaces.
# - Resource Quotas: Divide total cluster CPU/Memory/Storage among teams.
# - Network Isolation: Used as targets for NetworkPolicies.
# - Default Namespaces:
#   * default     : Default workspace for objects when no namespace is specified.
#   * kube-system : Reserved for core Kubernetes system components.
#   * kube-public : Readable by all users (mostly used for cluster info).
#   * kube-node-lease: Holds Lease objects for node heartbeats.
#
# IMPORTANT CLI COMMANDS:
# - Create:   kubectl apply -f namespace.yaml
# - List:     kubectl get namespaces (or kubectl get ns)
# - Inspect:  kubectl describe ns development
# - Switch:   kubectl config set-context --current --namespace=development
# - Delete:   kubectl delete -f namespace.yaml (CAUTION: Deletes ALL resources inside!)
# ==============================================================================

apiVersion: v1
kind: Namespace

metadata:
  # The unique name of the namespace across the entire cluster.
  # Must consist of lower-case alphanumeric characters or '-', and start/end with an alphanumeric.
  name: development

  # Labels are key/value pairs attached to objects for organization and selection.
  labels:
    # Common labels for environmental and organizational tracking
    environment: dev
    team: backend
    project: ecommerce
    
    # Pod Security Admission (PSA) label (Kubernetes 1.23+)
    # Levels: privileged, baseline, restricted
    # Modes: enforce, audit, warn
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest

  # Annotations store non-identifying metadata, audit info, or tool configurations.
  annotations:
    description: "Sandbox namespace for backend development and integration testing."
    owner: "dev-team@company.internal"

