# ==============================================================================
# Kubernetes Object: ResourceQuota (Production Tenant Quota)
# ==============================================================================
# WHAT IS A RESOURCEQUOTA?
# A ResourceQuota provides constraints that limit aggregate resource consumption 
# per namespace. It prevents one team or rogue application from consuming all 
# compute, storage, or API object slots in the cluster (noisy neighbor problem).
#
# IMPORTANT CLI COMMANDS:
# - Apply:    kubectl apply -f resource-quota.yaml
# - View:     kubectl get resourcequota -n production
# - Inspect:  kubectl describe resourcequota prod-compute-quota -n production
# ==============================================================================

apiVersion: v1
kind: ResourceQuota

metadata:
  name: prod-compute-quota
  namespace: production
  labels:
    environment: production
    managed-by: platform-sre

spec:
  hard:
    # --- Compute Resources ---
    requests.cpu: "16"            # Guaranteed cluster CPU reservation
    limits.cpu: "32"              # Hard CPU ceiling
    requests.memory: 32Gi         # Guaranteed cluster Memory reservation
    limits.memory: 64Gi           # Hard Memory ceiling

    # --- Storage Resources ---
    requests.storage: 200Gi       # Max persistent storage across all PVCs
    persistentvolumeclaims: "20"  # Max number of PVCs allowed

    # --- Object Counts ---
    pods: "50"                    # Max concurrent running pods
    services: "20"                # Max internal ClusterIP services
    services.loadbalancers: "3"   # Prevents runaway cloud load balancer costs
    configmaps: "50"
    secrets: "50"
