# ==============================================================================
# Kubernetes Object: LimitRange (Production Container Sizing Policy)
# ==============================================================================
# WHAT IS A LIMITRANGE?
# A LimitRange sets default, minimum, and maximum resource constraints for 
# individual Pods and Containers within a namespace. 
#
# IMPORTANT CLI COMMANDS:
# - Apply:    kubectl apply -f limit-range.yaml
# - View:     kubectl get limitrange -n production
# - Inspect:  kubectl describe limitrange prod-limit-range -n production
# ==============================================================================

apiVersion: v1
kind: LimitRange

metadata:
  name: prod-limit-range
  namespace: production
  labels:
    environment: production

spec:
  limits:
    # --------------------------------------------------------------------------
    # 1. Container-level constraints (applied to each container in a pod)
    # --------------------------------------------------------------------------
    - type: Container

      # Default limits injected if omitted by developer
      default:
        cpu: "500m"         # 0.5 CPU core
        memory: "512Mi"     # 512 Megabytes

      # Default requests injected if omitted
      defaultRequest:
        cpu: "100m"         # 0.1 CPU core
        memory: "128Mi"     # 128 Megabytes

      # Upper bounds for any single container
      max:
        cpu: "4"            # Max 4 CPU cores
        memory: "8Gi"       # Max 8 GiB memory

      # Lower bounds for any single container
      min:
        cpu: "50m"          # Min 0.05 CPU core
        memory: "64Mi"      # Min 64 Megabytes

      # Max limit-to-request ratio (prevents extreme overcommit)
      maxLimitRequestRatio:
        cpu: "4"
        memory: "2"

    # --------------------------------------------------------------------------
    # 2. Pod-level aggregate constraints
    # --------------------------------------------------------------------------
    - type: Pod
      max:
        cpu: "8"
        memory: "16Gi"

    # --------------------------------------------------------------------------
    # 3. PersistentVolumeClaim constraints
    # --------------------------------------------------------------------------
    - type: PersistentVolumeClaim
      min:
        storage: "1Gi"
      max:
        storage: "100Gi"
