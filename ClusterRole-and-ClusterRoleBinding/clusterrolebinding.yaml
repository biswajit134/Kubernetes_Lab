# ==============================================================================
# Kubernetes Object: ClusterRoleBinding (RBAC)
# ==============================================================================
# WHAT IS A CLUSTERROLEBINDING?
# A ClusterRoleBinding grants permissions defined in a ClusterRole across the 
# ENTIRE cluster (all namespaces, plus cluster-scoped resources like nodes).
#
# CONTRAST WITH ROLEBINDING:
# - RoleBinding bound to ClusterRole: Grants the permissions ONLY within that ONE namespace.
# - ClusterRoleBinding bound to ClusterRole: Grants the permissions CLUSTER-WIDE across ALL namespaces.
#
# IMPORTANT CLI COMMANDS:
# - Apply:        kubectl apply -f clusterrolebinding.yaml
# - Get:          kubectl get clusterrolebinding
# - Check Access: kubectl auth can-i get nodes --as=system:serviceaccount:default:monitoring-agent
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: node-reader-global-binding
  labels:
    tier: cluster-rbac

# Subjects receiving cluster-wide access
subjects:
  - kind: ServiceAccount
    name: monitoring-agent
    namespace: kube-system

# ClusterRole referenced
roleRef:
  kind: ClusterRole
  name: node-and-pv-reader
  apiGroup: rbac.authorization.k8s.io

